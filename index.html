
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080D14">
<title>Mili Browser 🐱</title>

<style>
:root{
 --black:#080D14;
 --dark:#111D2A;
 --panel:#142333;
 --cyan:#00D9FF;
 --white:#FFFFFF;
 --muted:#A8B8C8;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--black);
 color:var(--white);
 font-family:Arial,sans-serif;
}
header{
 background:#0C1722;
 padding:12px;
 border-bottom:1px solid #173448;
 position:sticky;
 top:0;
 z-index:5;
}
.brand{
 display:flex;
 align-items:center;
 gap:10px;
 font-size:21px;
 font-weight:bold;
 padding:5px 3px 13px;
}
.logo{
 background:var(--cyan);
 color:var(--black);
 width:43px;
 height:43px;
 border-radius:13px;
 display:grid;
 place-items:center;
 font-size:25px;
 box-shadow:0 0 15px #00d9ff55;
}
.brand span{color:var(--cyan)}
.tabs{
 display:flex;
 gap:7px;
 overflow-x:auto;
 margin-bottom:12px;
}
.tab{
 background:var(--panel);
 padding:11px;
 border-radius:10px;
 white-space:nowrap;
 cursor:pointer;
 font-size:13px;
 border:1px solid transparent;
}
.tab.active{
 background:var(--black);
 border-color:var(--cyan);
}
.tab button{
 background:none;
 color:var(--muted);
 border:0;
 padding-left:8px;
 font-size:17px;
}
.controls{
 display:flex;
 gap:6px;
 align-items:center;
}
button{
 background:var(--panel);
 color:white;
 border:1px solid #263D50;
 width:38px;
 height:38px;
 border-radius:50%;
 font-size:19px;
 cursor:pointer;
 flex-shrink:0;
}
button:active{background:#006d83}
input{
 flex:1;
 min-width:0;
 padding:13px;
 border:1px solid #294458;
 border-radius:25px;
 background:#142333;
 color:white;
 outline:none;
 font-size:14px;
}
input:focus{
 border-color:var(--cyan);
 box-shadow:0 0 8px #00d9ff44;
}
main{
 padding:18px;
 min-height:80vh;
 text-align:center;
}
.home{padding-top:9vh}
.cat{
 font-size:72px;
 filter:drop-shadow(0 0 12px #00d9ff66);
}
h1{
 font-size:35px;
 margin:10px;
}
h1 span{color:var(--cyan)}
.subtitle{color:var(--muted)}
.search{
 display:flex;
 gap:8px;
 max-width:600px;
 margin:28px auto;
}
.search button{
 background:var(--cyan);
 color:var(--black);
 width:auto;
 padding:0 20px;
 border-radius:25px;
 font-size:14px;
 font-weight:bold;
 border:0;
}
.shortcuts{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:12px;
 margin:30px auto;
}
.shortcut{
 background:var(--dark);
 color:white;
 text-decoration:none;
 width:90px;
 padding:17px 5px;
 border-radius:15px;
 border:1px solid #263D50;
 transition:.2s;
}
.shortcut:active{transform:scale(.95)}
.shortcut div{font-size:28px}
.shortcut p{font-size:13px;margin-bottom:0}
.section{
 max-width:600px;
 margin:25px auto;
 text-align:left;
}
.section h3{color:var(--cyan)}
.item{
 background:var(--dark);
 padding:13px;
 border-radius:12px;
 margin:8px 0;
 overflow-wrap:anywhere;
 border:1px solid #1d3448;
}
.item a{
 color:var(--white);
 text-decoration:none;
 font-size:13px;
}
.item button{
 float:right;
 width:30px;
 height:30px;
}
.note{
 color:var(--muted);
 font-size:12px;
 line-height:1.6;
}
.result{
 background:var(--dark);
 padding:18px;
 border-radius:15px;
 margin:10px auto;
 max-width:700px;
 overflow-wrap:anywhere;
 border:1px solid #1d3448;
}
.result a{color:var(--cyan)}
iframe{
 width:100%;
 height:65vh;
 border:1px solid #263D50;
 border-radius:12px;
 background:white;
 margin-top:10px;
}
.bottom{
 display:flex;
 justify-content:center;
 gap:12px;
 flex-wrap:wrap;
 margin-top:25px;
}
.bottom button{
 width:auto;
 height:auto;
 border-radius:12px;
 padding:12px 17px;
 font-size:13px;
}
footer{
 text-align:center;
 color:var(--muted);
 font-size:12px;
 padding:20px;
 border-top:1px solid #173448;
}
</style>
</head>

<body>
<header>
 <div class="brand">
  <div class="logo">🐱</div>
  <div>Mili <span>Browser</span></div>
 </div>

 <div class="tabs" id="tabs"></div>

 <div class="controls">
  <button onclick="back()" title="Voltar">‹</button>
  <button onclick="forward()" title="Avançar">›</button>
  <button onclick="reloadPage()" title="Atualizar">↻</button>
  <input id="address"
   placeholder="Pesquisar ou digitar endereço"
   onkeydown="if(event.key==='Enter')navigate(this.value)">
  <button onclick="newTab()" title="Nova aba">＋</button>
  <button onclick="bookmark()" title="Favoritar">☆</button>
 </div>
</header>

<main id="page"></main>

<footer>
 🐱 Mili Browser · Preto • Cyan • Branco
</footer>

<script>
const $=id=>document.getElementById(id);

let tabs=[{
 title:"Início",url:"",history:[],pos:-1
}];

let active=0;
let favorites=[];
let visits=[];

try{
 favorites=JSON.parse(localStorage.getItem("miliFav")||"[]");
 visits=JSON.parse(localStorage.getItem("miliHistory")||"[]");
}catch(e){}

function renderTabs(){
 $("tabs").innerHTML="";

 tabs.forEach((t,i)=>{
  let el=document.createElement("div");
  el.className="tab"+(i===active?" active":"");
  el.textContent=t.title;

  let close=document.createElement("button");
  close.textContent="×";
  close.onclick=e=>{
   e.stopPropagation();
   closeTab(i);
  };

  el.onclick=()=>switchTab(i);
  el.appendChild(close);
  $("tabs").appendChild(el);
 });
}

function newTab(){
 tabs.push({
  title:"Nova aba",
  url:"",
  history:[],
  pos:-1
 });
 active=tabs.length-1;
 renderTabs();
 home();
}

function switchTab(i){
 active=i;
 renderTabs();
 showCurrent();
}

function closeTab(i){
 tabs.splice(i,1);

 if(!tabs.length){
  tabs.push({
   title:"Início",url:"",history:[],pos:-1
  });
 }

 active=Math.min(active,tabs.length-1);
 renderTabs();
 showCurrent();
}

function home(){
 $("address").value="";

 $("page").innerHTML=`
 <div class="home">
  <div class="cat">🐱</div>
  <h1>Mili <span>Browser</span></h1>
  <p class="subtitle">Seu mundo. Sua internet.</p>

  <div class="search">
   <input id="homeSearch"
    placeholder="O que deseja pesquisar?"
    onkeydown="if(event.key==='Enter')navigate(this.value)">
   <button onclick="navigate($('homeSearch').value)">
    Pesquisar
   </button>
  </div>

  <div class="shortcuts">
   <a class="shortcut"
    href="https://www.google.com/" target="_blank" rel="noopener">
    <div>🔎</div><p>Google</p>
   </a>

   <a class="shortcut"
    href="https://www.youtube.com/" target="_blank" rel="noopener">
    <div>▶️</div><p>YouTube</p>
   </a>

   <a class="shortcut"
    href="https://www.wikipedia.org/" target="_blank" rel="noopener">
    <div>📚</div><p>Wikipedia</p>
   </a>
  </div>

  <div class="section">
   <h3>⭐ Favoritos</h3>
   <div id="favorites"></div>
  </div>

  <div class="section">
   <h3>🕘 Histórico recente</h3>
   <div id="history"></div>
  </div>

  <div class="bottom">
   <button onclick="clearHistory()">🗑 Limpar histórico</button>
  </div>

  <p class="note">
   Mili Browser 🐱<br>
   Navegue, descubra e explore.
  </p>
 </div>`;

 renderFavorites();
 renderHistory();
}

function navigate(value,record=true){
 value=value.trim();
 if(!value)return;

 let url;

 if(/^https?:\/\//i.test(value)){
  url=value;
 }else if(/^[^\s]+\.[^\s]+$/.test(value)){
  url="https://"+value;
 }else{
  url="https://www.google.com/search?q="+
  encodeURIComponent(value);
 }

 try{
  if(!["http:","https:"].includes(new URL(url).protocol)){
   return;
  }
 }catch(e){return;}

 let t=tabs[active];

 if(record){
  t.history=t.history.slice(0,t.pos+1);
  t.history.push(url);
  t.pos=t.history.length-1;

  visits.unshift(url);
  visits=[...new Set(visits)].slice(0,30);
  save();
 }

 t.url=url;
 t.title=value.length>15?
 value.slice(0,15)+"…":value;

 renderTabs();
 showPage(url);
}

function showPage(url){
 $("address").value=url;

 $("page").innerHTML=`
 <div class="result">
  <h3>🌐 Mili Browser</h3>
  <p id="current"></p>
  <a id="external" target="_blank"
   rel="noopener noreferrer">
   Abrir site em nova aba ↗
  </a>
  <p class="note">
   Se o site não carregar, ele pode bloquear
   a exibição dentro de outros sites.
   Use o link acima.
  </p>
 </div>

 <iframe title="Página da internet"
  referrerpolicy="no-referrer"></iframe>`;

 $("current").textContent=url;
 $("external").href=url;
 $("page").querySelector("iframe").src=url;
}

function showCurrent(){
 let t=tabs[active];
 if(t.url)showPage(t.url);
 else home();
}

function back(){
 let t=tabs[active];

 if(t.pos>0){
  t.pos--;
  t.url=t.history[t.pos];
  showPage(t.url);
 }
}

function forward(){
 let t=tabs[active];

 if(t.pos<t.history.length-1){
  t.pos++;
  t.url=t.history[t.pos];
  showPage(t.url);
 }
}

function reloadPage(){
 let t=tabs[active];
 if(t.url){
  showPage(t.url);
 }else{
  home();
 }
}

function save(){
 try{
  localStorage.setItem("miliFav",JSON.stringify(favorites));
  localStorage.setItem("miliHistory",JSON.stringify(visits));
 }catch(e){}
}

function bookmark(){
 let url=tabs[active].url;

 if(!url){
  alert("Abra um site primeiro!");
  return;
 }

 if(!favorites.includes(url)){
  favorites.unshift(url);
  save();
 }

 alert("⭐ Favorito salvo!");
}

function renderFavorites(){
 let box=$("favorites");
 if(!box)return;

 box.innerHTML="";

 if(!favorites.length){
  box.textContent="Nenhum favorito ainda.";
  return;
 }

 favorites.forEach(url=>{
  let item=document.createElement("div");
  item.className="item";

  let link=document.createElement("a");
  link.textContent="⭐ "+url;
  link.href=url;
  link.target="_blank";
  link.rel="noopener noreferrer";

  let remove=document.createElement("button");
  remove.textContent="×";

  remove.onclick=()=>{
   favorites=favorites.filter(x=>x!==url);
   save();
   renderFavorites();
  };

  item.append(link,remove);
  box.appendChild(item);
 });
}

function renderHistory(){
 let box=$("history");
 if(!box)return;

 box.innerHTML="";

 if(!visits.length){
  box.textContent="Nenhum site visitado ainda.";
  return;
 }

 visits.slice(0,5).forEach(url=>{
  let item=document.createElement("div");
  item.className="item";

  let link=document.createElement("a");
  link.textContent="🕘 "+url;
  link.href=url;
  link.target="_blank";
  link.rel="noopener noreferrer";

  item.appendChild(link);
  box.appendChild(item);
 });
}

function clearHistory(){
 if(!confirm("Deseja apagar todo o histórico?"))return;

 visits=[];
 save();
 renderHistory();
}

renderTabs();
home();
</script>
</body>
</html>
